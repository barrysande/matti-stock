packages:
  - "apps/*"
overrides:
  # @dnd-kit-svelte pins geometry 0.1.21 but its @dnd-kit/abstract dep pulls 0.2.4; force a single version so the drag-event Position types don't clash (data-table).
  "@dnd-kit/geometry": "0.2.4"

allowBuilds:
  "@swc/core": true
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
